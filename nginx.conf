# Baños Bebidas, LP estática em https://www.banosbebidas.com.br
# Pensado para rodar atrás do Traefik (TLS termina no Traefik; aqui chega HTTP).
# Vai para /etc/nginx/conf.d/default.conf (ver Dockerfile).

# domínio sem www -> www (o Google já conhece a versão com www)
server {
    listen 80;
    server_name banosbebidas.com.br;
    return 301 https://www.banosbebidas.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name www.banosbebidas.com.br _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # /index.html -> / (uma URL só para a home). Usa $request_uri, que é a URL
    # ORIGINAL do pedido: um "location = /index.html { return 301 / }" entraria
    # em loop, porque a diretiva index faz redirect INTERNO de / para /index.html.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }

    # mime.types do http{} da imagem já cobre txt, xml, webp, woff2, svg e mp4;
    # aqui só garante o charset (llms.txt e sitemap têm acentos)
    charset_types text/plain text/xml text/css application/xml application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/ld+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # HTML: sempre revalida (o conteúdo muda a cada deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # CSS/JS têm ?v= no HTML; imagens, fontes e vídeo mudam de nome quando mudam
    location ~* \.(css|js|webp|jpg|jpeg|png|gif|svg|ico|woff2|mp4)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # robots, sitemap e llms: cache curto
    location ~* \.(txt|xml)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

}
